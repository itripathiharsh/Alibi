services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alibi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alibi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-alibi}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alibi} -d ${POSTGRES_DB:-alibi}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: alibi-api
    restart: unless-stopped
    environment:
      ALIBI_MODE: local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-alibi}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-alibi}
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: alibi-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      ALIBI_MODE: local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-alibi}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-alibi}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: alibi-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => process.exit([200, 307, 308, 302].includes(r.statusCode) ? 0 : 1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: alibi-postgres-data
