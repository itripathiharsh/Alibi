[project]
name = "alibi-backend"
version = "0.1.0"
description = "ALIBI Backend API & Worker"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "ALIBI Team", email = "dev@alibi.local" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "uuid6>=2024.7.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psutil>=6.1.0",
    "tzdata>=2024.2",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "python-dateutil>=4.0.0",
    "dateparser>=1.5.0",
    "python-multipart>=0.0.33",
    "pgvector>=0.5.1",
    "openpyxl>=3.1.5",
    "httpx>=0.28.0",
    "apscheduler>=3.11.3,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
    "hypothesis>=6.170.15",
    "types-python-dateutil>=2.9.0.20261104",
]

[tool.uv]
required-version = ">=0.12"
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = ["E501", "B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["req(id): requirement ID covered by this test"]

[tool.importlinter]
root_package = "app"
