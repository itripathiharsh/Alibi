name: ALIBI Nightly Maintenance

on:
  schedule:
    # 20:00 UTC = 01:30 AM IST nightly
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  maintenance:
    name: Database Maintenance & Recurrence Generation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          uv sync --frozen --no-dev
        working-directory: backend

      - name: Advance recurrence and refresh learning profiles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALIBI_SECRET_KEY: ${{ secrets.ALIBI_SECRET_KEY }}
          ALIBI_ENCRYPTION_KEY: ${{ secrets.ALIBI_ENCRYPTION_KEY }}
          ALIBI_MODE: hosted
        run: uv run python -m app.maintenance
        working-directory: backend

